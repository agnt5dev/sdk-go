name: SDK Go Release

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example, 0.2.0)"
        required: true
        type: string
      skip-publish:
        description: "Validate without creating the release tag"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Validate and tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        if: github.event_name == 'workflow_dispatch' && inputs.skip-publish != true
        run: test "${GITHUB_REF_NAME}" = main

      - name: Validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            echo "version=pull-request" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = release ]; then
            if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Release tag must be vX.Y.Z: $RELEASE_TAG" >&2
              exit 1
            fi
            VERSION=${RELEASE_TAG#v}
            if ! grep -Fq "## [$VERSION]" CHANGELOG.md; then
              echo "CHANGELOG.md is missing ## [$VERSION]" >&2
              exit 1
            fi
          else
            VERSION=$INPUT_VERSION
          fi

          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must be x.y.z without a leading v: $VERSION" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] && git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test SDK
        run: go test ./...

      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch' && inputs.skip-publish != true
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "agnt5-release-bot"
          git config user.email "release-bot@agnt5.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Output release summary
        run: |
          {
            echo "## Go SDK Release"
            echo "**Module:** \`github.com/agnt5dev/sdk-go\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            if [ "${{ github.event_name }}" = release ]; then
              echo "**Version:** \`v${{ steps.version.outputs.version }}\`"
              echo "**Release:** GitHub Release validation"
            elif [ "${{ github.event_name }}" = pull_request ]; then
              echo "**Release:** pull-request validation only"
            else
              echo "**Version:** \`v${{ steps.version.outputs.version }}\`"
              echo "**Dry run:** \`${{ inputs.skip-publish && 'yes' || 'no' }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
